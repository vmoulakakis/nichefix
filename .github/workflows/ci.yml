name: ci

on:
  pull_request:
  push:
    branches: [main, foundation-v1]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Preserve generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: foundation-pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 1
          if-no-files-found: error
      - run: pnpm check
      - run: pnpm build
