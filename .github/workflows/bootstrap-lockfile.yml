name: bootstrap-lockfile

on:
  push:
    branches: [foundation-v1]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: foundation-v1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - name: Commit generated lockfile once
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "Lockfile already tracked and unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: lock foundation dependencies"
          git push origin HEAD:foundation-v1
